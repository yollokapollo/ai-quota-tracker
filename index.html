<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.github.com;">
  <title>AI Quota Tracker</title>
  <style>
    :root { --bg: #1e1e2e; --card: #313244; --input: #45475a; --text: #cdd6f4; --subtext: #a6adc8; --accent: #89b4fa; --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 0.5rem; flex-wrap: wrap; }
    h1 { color: var(--accent); margin: 0; font-size: 1.5rem; }
    .badge { font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 99px; background: var(--input); display: inline-block; margin-top: 0.25rem; }
    .badge.live { background: var(--green); color: #11111b; font-weight: bold; }
    .badge.locked { background: var(--yellow); color: #11111b; font-weight: bold; }
    .card, form { background: var(--card); padding: 1rem; border-radius: 10px; margin-bottom: 1rem; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .row + .row { margin-top: 0.5rem; }
    input, select, button { padding: 0.6rem; border-radius: 6px; border: none; background: var(--input); color: #fff; font-size: 0.95rem; }
    input, select { flex: 1; min-width: 130px; }
    input.projects-input { flex: 2; min-width: 220px; }
    input.time-24 { max-width: 115px; min-width: 95px; font-family: monospace; text-align: center; }
    input.date-iso { max-width: 165px; min-width: 145px; font-family: monospace; }
    select.filter-select { max-width: 180px; }
    button { background: var(--accent); color: #11111b; font-weight: bold; cursor: pointer; }
    button.secondary { background: var(--input); color: var(--text); }
    button.edit { background: var(--yellow); color: #11111b; padding: 0.35rem 0.65rem; font-size: 0.85rem; }
    button.del { background: var(--red); color: #11111b; padding: 0.35rem 0.65rem; font-size: 0.85rem; margin-left: 0.4rem; }
    .quick-btns { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; align-items: center; }
    .quick-btns button { font-size: 0.8rem; padding: 0.35rem 0.65rem; background: var(--input); color: var(--text); }
    .filter-bar { background: var(--card); padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1rem; }
    .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--input); padding: 0.85rem 0; gap: 0.75rem; flex-wrap: wrap; }
    .item:last-child { border-bottom: none; }
    .project-tag { display: block; color: var(--subtext); font-size: 0.88rem; margin-top: 0.2rem; }
    .meta-time { display: block; font-size: 0.82rem; opacity: 0.85; margin-top: 0.2rem; }
    .actions { display: flex; align-items: center; gap: 0.25rem; }
    .countdown { font-family: monospace; font-size: 1.15rem; color: var(--green); margin-right: 0.5rem; }
    .ready { color: var(--yellow); font-weight: bold; }
    .hint { font-size: 0.85rem; opacity: 0.85; margin: 0 0 0.75rem 0; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AI Quota Tracker</h1>
      <span id="modeBadge" class="badge">Demo-Modus (Öffentlich)</span>
    </div>
    <button id="authToggleBtn" class="secondary" type="button">Login / Tresor</button>
  </header>

  <div id="authBox" class="card" style="display:none;">
    <p class="hint"><strong>Zero-Knowledge Cloud-Sync:</strong> Gist-ID &amp; Token bleiben lokal im Browser. Dein Tresor-Passwort wird <em>nicht</em> gespeichert und verschlüsselt alle Daten inkl. Projekte per AES-256 vor dem Upload.</p>
    <div class="row">
      <input id="gistId" maxlength="100" autocomplete="off" placeholder="Privates Gist ID">
      <input id="ghToken" type="password" maxlength="200" autocomplete="off" placeholder="GitHub Token (gist)">
      <input id="vaultPass" type="password" maxlength="200" autocomplete="off" placeholder="Tresor-Passwort (AES-256)">
      <button id="connectBtn" type="button">Entsperren &amp; Verbinden</button>
      <button id="logoutBtn" class="secondary" type="button">Trennen</button>
    </div>
  </div>

  <form id="quotaForm">
    <div class="row">
      <select id="ai">
        <option>Claude</option>
        <option>ChatGPT</option>
        <option>Gemini</option>
        <option>DeepSeek</option>
      </select>
      <input id="account" maxlength="120" placeholder="Account / E-Mail" required>
      <input id="resetDate" class="date-iso" type="date" required>
      <input id="resetTime24" class="time-24" type="text" inputmode="numeric" pattern="^([01]\d|2[0-3]):[0-5]\d$" placeholder="HH:MM" title="24-Stunden-Format HH:MM, z. B. 22:30" required>
    </div>
    <div class="row">
      <input id="projects" class="projects-input" maxlength="240" placeholder="Aktuelle Projekte (z. B. Bewerbungs-Portfolio, API-Refactoring)">
      <button id="submitBtn" type="submit">Hinzufügen</button>
      <button id="cancelEditBtn" type="button" class="secondary" style="display:none;">Abbrechen</button>
    </div>
    <div class="quick-btns">
      <button type="button" data-hours="3">+3 Std</button>
      <button type="button" data-hours="5">+5 Std</button>
      <button type="button" data-hours="24">+24 Std</button>
    </div>
  </form>

  <div class="filter-bar">
    <div class="row">
      <select id="filterAi" class="filter-select" aria-label="Nach KI-Dienst filtern">
        <option value="ALL">Alle KI-Dienste</option>
        <option value="Claude">Claude</option>
        <option value="ChatGPT">ChatGPT</option>
        <option value="Gemini">Gemini</option>
        <option value="DeepSeek">DeepSeek</option>
      </select>
      <input id="filterQuery" maxlength="120" placeholder="Suche nach Projekt oder Account..." aria-label="Suche nach Projekt oder Account">
      <button id="resetFilterBtn" class="secondary" type="button">Filter zurücksetzen</button>
    </div>
  </div>

  <div id="list" class="card">Lade Einträge...</div>

  <script>
    const ALLOWED_AIS = new Set(["Claude", "ChatGPT", "Gemini", "DeepSeek"]);

    const DEMO_DATA = [
      { id: 1, ai: "Claude", account: "max.mustermann@example.com", projects: "Arch-Dotfiles & Systemd-Units", resetTime: Date.now() + 2 * 3600000 },
      { id: 2, ai: "Claude", account: "maria.musterfrau@example.com", projects: "Portfolio-Website & Case Studies", resetTime: Date.now() + 4.5 * 3600000 },
      { id: 3, ai: "DeepSeek", account: "max.mustermann@example.com", projects: "Log-Parser & Testdaten-Skripte", resetTime: Date.now() - 60000 }
    ];

    let items = [];
    let editingId = null;
    let sessionPassword = "";
    let filterAi = "ALL";
    let filterQuery = "";

    const getAuth = () => ({
      gistId: localStorage.getItem('ai_quota_gist_id') || '',
      token: localStorage.getItem('ai_quota_gh_token') || ''
    });

    function sanitizeItems(rawList) {
      if (!Array.isArray(rawList)) return [];
      return rawList
        .filter(entry => entry && typeof entry === "object")
        .map((entry, idx) => ({
          id: typeof entry.id === "number" || typeof entry.id === "string" ? entry.id : `${Date.now()}-${idx}`,
          ai: ALLOWED_AIS.has(entry.ai) ? entry.ai : "Claude",
          account: typeof entry.account === "string" ? entry.account.slice(0, 120) : "",
          projects: typeof entry.projects === "string" ? entry.projects.slice(0, 240) : "",
          resetTime: Number.isFinite(Number(entry.resetTime)) ? Number(entry.resetTime) : Date.now()
        }));
    }

    // --- Web Crypto API (PBKDF2 + AES-GCM 256-Bit) ---
    const b64Encode = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const b64Decode = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(dataObj, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
      return JSON.stringify({
        v: 1,
        alg: "AES-GCM-256",
        salt: b64Encode(salt),
        iv: b64Encode(iv),
        ct: b64Encode(cipher)
      }, null, 2);
    }

    async function decryptPayload(rawText, password) {
      const parsed = JSON.parse(rawText);
      if (Array.isArray(parsed)) return sanitizeItems(parsed);
      if (!parsed.ct || !parsed.salt || !parsed.iv) throw new Error("Unbekanntes Datenformat");
      const key = await deriveKey(password, b64Decode(parsed.salt));
      const plainBuf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64Decode(parsed.iv) },
        key,
        b64Decode(parsed.ct)
      );
      return sanitizeItems(JSON.parse(new TextDecoder().decode(plainBuf)));
    }

    // --- Datum & Zeit ---
    const pad2 = n => String(n).padStart(2, '0');

    function setDateTimeInputsFromTimestamp(ts) {
      const d = new Date(ts);
      document.getElementById('resetDate').value = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      document.getElementById('resetTime24').value = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function parseDateTimeInputs() {
      const dateStr = document.getElementById('resetDate').value.trim();
      const timeStr = document.getElementById('resetTime24').value.trim();
      const match = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(timeStr);
      if (!dateStr || !match) {
        alert("Bitte Uhrzeit im 24h-Format HH:MM eingeben (z. B. 22:30).");
        return null;
      }
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d, Number(match[1]), Number(match[2]), 0, 0).getTime();
    }

    function formatDeDateTime(ts) {
      const d = new Date(ts);
      return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}, ${pad2(d.getHours())}:${pad2(d.getMinutes())} Uhr`;
    }

    // --- Auth & Sync ---
    function toggleAuth(forceOpen = null) {
      const box = document.getElementById('authBox');
      const show = forceOpen !== null ? forceOpen : box.style.display === 'none';
      box.style.display = show ? 'block' : 'none';
      document.getElementById('gistId').value = getAuth().gistId;
      document.getElementById('ghToken').value = getAuth().token;
      if (show) document.getElementById('vaultPass').focus();
    }

    function saveAuth() {
      const gistId = document.getElementById('gistId').value.trim();
      const token = document.getElementById('ghToken').value.trim();
      const pass = document.getElementById('vaultPass').value;
      if (!gistId || !token || !pass) {
        alert("Bitte Gist-ID, Token und Tresor-Passwort ausfüllen.");
        return;
      }
      localStorage.setItem('ai_quota_gist_id', gistId);
      localStorage.setItem('ai_quota_gh_token', token);
      sessionPassword = pass;
      document.getElementById('vaultPass').value = '';
      document.getElementById('authBox').style.display = 'none';
      loadData();
    }

    function logout() {
      localStorage.removeItem('ai_quota_gist_id');
      localStorage.removeItem('ai_quota_gh_token');
      sessionPassword = "";
      document.getElementById('vaultPass').value = '';
      document.getElementById('authBox').style.display = 'none';
      loadData();
    }

    async function loadData() {
      const { gistId, token } = getAuth();
      const badge = document.getElementById('modeBadge');

      if (!gistId || !token) {
        badge.textContent = "Demo-Modus (Öffentlich)";
        badge.className = "badge";
        items = sanitizeItems(JSON.parse(JSON.stringify(DEMO_DATA)));
        render();
        return;
      }

      if (!sessionPassword) {
        badge.textContent = "Tresor gesperrt (Passwort eingeben)";
        badge.className = "badge locked";
        items = [];
        render("Bitte oben auf 'Login / Tresor' klicken und dein Tresor-Passwort eingeben.");
        toggleAuth(true);
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
          headers: { Authorization: `token ${token}` }
        });
        if (!res.ok) throw new Error("Gist nicht erreichbar");
        const gist = await res.json();
        const file = gist.files && gist.files['limits.json'];
        items = file ? await decryptPayload(file.content, sessionPassword) : [];
        badge.textContent = "Verschlüsselt (AES-256 Sync)";
        badge.className = "badge live";
        render();
      } catch (err) {
        sessionPassword = "";
        badge.textContent = "Entschlüsselung fehlgeschlagen";
        badge.className = "badge locked";
        alert("Konnte Tresor nicht entschlüsseln. Falsches Passwort, falscher Token oder ungültige Gist-ID.");
        toggleAuth(true);
      }
    }

    async function saveData() {
      const { gistId, token } = getAuth();
      render();
      if (!gistId || !token || !sessionPassword) return;

      try {
        const encryptedContent = await encryptPayload(items, sessionPassword);
        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
          method: 'PATCH',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            files: { 'limits.json': { content: encryptedContent } }
          })
        });
        if (!res.ok) throw new Error("Upload fehlgeschlagen");
      } catch (err) {
        alert("Fehler beim Speichern in dein privates Gist. Verbindung und Token prüfen.");
      }
    }

    // --- Filter & Suche ---
    function getFilteredItems() {
      const q = filterQuery.trim().toLowerCase();
      return items
        .filter(i => {
          if (filterAi !== "ALL" && i.ai !== filterAi) return false;
          if (!q) return true;
          const haystack = `${i.projects || ""} ${i.account || ""}`.toLowerCase();
          return haystack.includes(q);
        })
        .sort((a, b) => a.resetTime - b.resetTime);
    }

    function resetFilters() {
      filterAi = "ALL";
      filterQuery = "";
      document.getElementById('filterAi').value = "ALL";
      document.getElementById('filterQuery').value = "";
      render();
    }

    // --- CRUD & Sicheres DOM-Rendering (XSS-frei) ---
    function startEdit(id) {
      const entry = items.find(i => i.id === id);
      if (!entry) return;
      editingId = id;
      document.getElementById('ai').value = ALLOWED_AIS.has(entry.ai) ? entry.ai : "Claude";
      document.getElementById('account').value = entry.account || "";
      document.getElementById('projects').value = entry.projects || "";
      setDateTimeInputsFromTimestamp(entry.resetTime);
      document.getElementById('submitBtn').textContent = "Speichern";
      document.getElementById('cancelEditBtn').style.display = "inline-block";
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('quotaForm').reset();
      document.getElementById('submitBtn').textContent = "Hinzufügen";
      document.getElementById('cancelEditBtn').style.display = "none";
      setDateTimeInputsFromTimestamp(Date.now());
    }

    function submitEntry(e) {
      e.preventDefault();
      const ts = parseDateTimeInputs();
      if (ts === null) return;

      const rawAi = document.getElementById('ai').value;
      const ai = ALLOWED_AIS.has(rawAi) ? rawAi : "Claude";
      const account = document.getElementById('account').value.trim().slice(0, 120);
      const projects = document.getElementById('projects').value.trim().slice(0, 240);

      if (editingId !== null) {
        items = items.map(i => i.id === editingId ? { ...i, ai, account, projects, resetTime: ts } : i);
        cancelEdit();
      } else {
        items.push({ id: Date.now(), ai, account, projects, resetTime: ts });
        document.getElementById('account').value = '';
        document.getElementById('projects').value = '';
        setDateTimeInputsFromTimestamp(Date.now());
      }
      saveData();
    }

    function removeEntry(id) {
      if (editingId === id) cancelEdit();
      items = items.filter(i => i.id !== id);
      saveData();
    }

    function render(emptyMessage = 'Keine passenden Einträge vorhanden.') {
      const list = document.getElementById('list');
      list.replaceChildren();

      const visibleItems = getFilteredItems();
      if (!visibleItems.length) {
        list.textContent = emptyMessage;
        return;
      }

      for (const i of visibleItems) {
        const row = document.createElement('div');
        row.className = 'item';

        const info = document.createElement('div');
        const strong = document.createElement('strong');
        strong.textContent = i.ai;
        info.appendChild(strong);
        info.appendChild(document.createTextNode(` – ${i.account}`));

        if (i.projects) {
          const projSpan = document.createElement('span');
          projSpan.className = 'project-tag';
          projSpan.textContent = `Projekte: ${i.projects}`;
          info.appendChild(projSpan);
        }

        const timeSpan = document.createElement('span');
        timeSpan.className = 'meta-time';
        timeSpan.textContent = `Verfügbar ab: ${formatDeDateTime(i.resetTime)}`;
        info.appendChild(timeSpan);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const cd = document.createElement('span');
        cd.className = 'countdown';
        cd.dataset.time = String(i.resetTime);
        cd.textContent = '...';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'edit';
        editBtn.textContent = 'Bearbeiten';
        editBtn.addEventListener('click', () => startEdit(i.id));

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'del';
        delBtn.textContent = 'X';
        delBtn.addEventListener('click', () => removeEntry(i.id));

        actions.append(cd, editBtn, delBtn);
        row.append(info, actions);
        list.appendChild(row);
      }
      updateCountdowns();
    }

    function updateCountdowns() {
      const now = Date.now();
      document.querySelectorAll('.countdown').forEach(el => {
        const diff = parseInt(el.dataset.time, 10) - now;
        if (diff <= 0) {
          el.textContent = 'VERFÜGBAR!';
          el.classList.add('ready');
        } else {
          el.classList.remove('ready');
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          el.textContent = `${h}h ${m}m ${s}s`;
        }
      });
    }

    document.getElementById('authToggleBtn').addEventListener('click', () => toggleAuth());
    document.getElementById('connectBtn').addEventListener('click', saveAuth);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('quotaForm').addEventListener('submit', submitEntry);
    document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
    document.getElementById('filterAi').addEventListener('change', e => {
      filterAi = ALLOWED_AIS.has(e.target.value) ? e.target.value : "ALL";
      render();
    });
    document.getElementById('filterQuery').addEventListener('input', e => {
      filterQuery = String(e.target.value || "").slice(0, 120);
      render();
    });
    document.getElementById('resetFilterBtn').addEventListener('click', resetFilters);
    document.querySelectorAll('.quick-btns button').forEach(btn => {
      btn.addEventListener('click', () => setDateTimeInputsFromTimestamp(Date.now() + Number(btn.dataset.hours) * 3600000));
    });

    setDateTimeInputsFromTimestamp(Date.now());
    setInterval(updateCountdowns, 1000);
    loadData();
  </script>
</body>
</html>
